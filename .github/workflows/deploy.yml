name: Deploy naar GitHub Pages

on:
  push:
    branches: [main, master, claude/bookwidgets-web-app-kvcfim]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── Kwaliteitspoort ─────────────────────────────────────────────────
      # Faalt één van deze stappen, dan stopt de job en wordt er niets
      # gedeployd. De Playwright-rooktest (tests/smoke.mjs) draait bewust
      # lokaal: een browserdownload maakt de pipeline traag en broos.
      - name: Lint
        run: npm run lint
      - name: Typecontrole
        run: npm run typecheck
      - name: Unittests (scoringsmotor)
        run: npm test

      - name: Bouwen
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # probeert GitHub Pages automatisch te activeren voor deze repo
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
